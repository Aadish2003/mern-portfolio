<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Aadish AR Hologram</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <!-- We will use a standard Hiro marker -->
      <a-marker preset="hiro">
        
        <!-- Rotating Data Cube -->
        <a-box 
          position="0 0.5 0" 
          material="color: #A855F7; opacity: 0.7; transparent: true;" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-box>
        
        <!-- Floating Text -->
        <a-text 
          value="AADISH KOTADIA" 
          position="0 1.8 0" 
          rotation="-90 0 0"
          color="#06B6D4" 
          scale="1.5 1.5 1.5"
          align="center">
        </a-text>

        <a-text 
          value="Data Analyst | AI | Business" 
          position="0 1.2 0.5" 
          rotation="-90 0 0"
          color="#FFFFFF" 
          scale="0.8 0.8 0.8"
          align="center">
        </a-text>

        <a-text 
          value="HIRE ME!" 
          position="0 0.5 1" 
          rotation="-90 0 0"
          color="#10B981" 
          scale="1.2 1.2 1.2"
          align="center"
          animation="property: position; to: 0 0.8 1; dir: alternate; dur: 1000; loop: true">
        </a-text>

      </a-marker>
      
      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
